[package]
name = "bevy_tiles"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bevy library for working with entities in grids."

[features]
render = ["bevy/bevy_sprite_render"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = {workspace = true, default-features = false, features = ["bevy_camera"]}

[dev-dependencies]
rstest = {workspace = true}
bevy = {workspace = true, default-features = true}
bevy_tiles_macros = { path = "../bevy_tiles_macros" }
rand = "0.9.2"
rand_chacha = "0.9.0"

[lints]
workspace = true